# Site configuration — https://gohugo.io/configuration/
baseURL = "/"                 # links are root-relative, so the same build works on any Cloudflare domain
languageCode = "en"
title = "Bruno Crispo — Security Research"
disableKinds = ["RSS", "sitemap", "taxonomy", "term"]

# ---- Top menu (order = weight) ------------------------------------------------
[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10
[[menus.main]]
  name = "Research"
  pageRef = "/research"
  weight = 20
[[menus.main]]
  name = "Publications"
  pageRef = "/publications"
  weight = 30
[[menus.main]]
  name = "Mentorship"
  pageRef = "/mentorship"
  weight = 40

# ---- Values reused across pages -------------------------------------------------
[params]
  name = "Bruno Crispo"
  description = "Bruno Crispo, University of Trento. Research in web security, systems security, IoT, authentication and privacy."
  email = "bruno.crispo@unitn.it"
  scholar = "https://scholar.google.com/citations?user=QHQUuuYAAAAJ&hl=en&sortby=pubdate"

  homeProjects = false             # true shows the "Research projects" block on the home page again

  # Live publication list on the Publications page (see assets/js/publications.js)
