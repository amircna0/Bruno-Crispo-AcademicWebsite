<header class="top"><div class="wrap nav">
<a class="brand" href="{{ "/" | relURL }}">{{ site.Params.name }}<small>{{ site.Params.contact.university }}</small></a>
<nav class="navlinks" aria-label="Main navigation">
{{- $page := . -}}
{{- range site.Menus.main }}<a href="{{ .URL }}"{{ if $page.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end -}}
</nav></div></header>
